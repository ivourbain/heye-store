# Netlify-instellingen voor de Melissa webshop
# - de website staat in de hoofdmap
# - de servercode (functions) staat in netlify/functions

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # products.js en instellingen.js meegeven aan de servercode. Zonder
  # deze regel kan create-payment.js de prijzen en verzendkosten niet
  # zelf opzoeken en weigert elke online betaling ("Productlijst niet
  # leesbaar" of "Instellingen niet leesbaar op de server").
  included_files = ["products.js", "instellingen.js"]

# Kortingscodes zijn geen echt geheim zoals een API-sleutel: de klant krijgt
# de code gewoon in een mail. Netlify's geheimenscan mag KORTINGSCODES dus
# overslaan; anders blokkeert hij de deploy zodra een code toevallig als
# woord in een bestand voorkomt (bv. "HEYE" of "WELKOM").
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "KORTINGSCODES"
